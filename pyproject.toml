[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-pack"
version = "0.1.0"
description = "Deterministic, verifiable CI evidence bundles (internal tool)"
requires-python = ">=3.10"
dependencies = ["typer>=0.12,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
evidence-pack = "evidence_pack.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
