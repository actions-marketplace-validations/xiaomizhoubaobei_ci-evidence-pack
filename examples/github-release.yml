# 发版即取证（GitHub 版）：打 tag → 构建 → 生成并签名证据包 → 自检 → 挂到 Release。
#
# 照抄到 .github/workflows/ 就能跑。需要你改的只有一处：
#   「构建」步骤里的产物路径（并同步改 include 里对应那一行）
#
# 不需要任何密钥：签名的身份来自 OIDC，锁的是一张 10 分钟就过期的短期证书，
# 没有任何长期私钥要保管 —— 也就没有「私钥泄露 = 永久被冒充」这回事。
# 但请记住——sha256 被写进 Release 正文，才让这份包成为证据；
# 包里那份 manifest 只证明自洽。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 顶层只给只读：写能力（发 Release）下沉到 job，避免任一步骤被替换就拿到发布权。
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发 Release 需要
      id-token: write   # 签名的信任根：没有它就拿不到短期证书
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全历史：SOURCE_DATE_EPOCH 才能稳定落到 commit 时间

      # ↓↓↓ 换成你自己的构建步骤 ↓↓↓
      - name: 构建
        run: |
          mkdir -p dist
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist
      # ↑↑↑ 上面是唯一需要你改的地方 ↑↑↑

      - name: 生成证据包并自检
        id: evidence
        uses: xiaomizhoubaobei/ci-evidence-pack@6d8ae66b768b8a77fb691fcb88729c8fc13dd912
        with:
          include: |
            dist/
            pyproject.toml
          sbom: auto
          # 包外台账：sha256 落到 _evidence/anchor.txt，随 artifact 一起上传
          anchor-file: _evidence/anchor.txt
          # 签名是默认动作，不给 sign 就是签：OIDC 换短期证书，没有别的分支。
          # 小写 'false' 才是关；空串 = 没给 = 沿用默认（默认签名）。
          # 包内记了 remote 就核对；没记（actions/checkout 默认没有）只留告警不判红。
          expect-repo: ${{ github.repository }}

      # 白名单校验：证据包里只允许出现你打算交付的东西。
      # 开发资产（.git/ tests/ AGENTS.md install_gpg_keys.sh 等）一旦混进去，
      # 就可能被铺到使用者的目录里；其中改写全局 git 配置的脚本若被误执行，
      # 后果由误把开发资产当交付物的那一方承担 —— 所以宁可在这里硬拒。
      #
      # 清单用 python 的 tarfile 读，而不是 `tar -tzf | awk`：后者遇到带空格的
      # 文件名会截断，白名单校验就变成漏判。
      - name: 校验证据包边界
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BUNDLE: ${{ steps.evidence.outputs.bundle-path }}
          ALLOW: '^(dist/|pyproject\.toml$)'
          REQUIRED: 'dist/'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys, tarfile

          bundle = os.environ["BUNDLE"]
          allow = re.compile(os.environ["ALLOW"])
          required = os.environ["REQUIRED"].split()

          with tarfile.open(bundle, "r:gz") as tar:
              # 包内布局见 docs：artifacts/<仓库相对路径>
              entries = [n[len("artifacts/"):] for n in tar.getnames()
                         if n.startswith("artifacts/")]

          bad = sorted(e for e in entries if e and not allow.match(e))
          if bad:
              sys.exit(f"::error::证据包里混入了白名单之外的条目: {', '.join(bad[:5])}")
          missing = [r for r in required if not any(e.startswith(r) for e in entries)]
          if missing:
              sys.exit(f"::error::证据包缺少必需路径: {', '.join(missing)}")
          print(f"证据包边界校验通过（{len(entries)} 个条目）")
          PY

      - name: 挂到 Release 并把锚点写进正文
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.evidence.outputs.bundle-path }}
          SIGNATURE: ${{ steps.evidence.outputs.signature-bundle }}
          SHA256: ${{ steps.evidence.outputs.bundle-sha256 }}
          SIGN_MODE: ${{ steps.evidence.outputs.signature-mode }}
          VERIFY_CODE: ${{ steps.evidence.outputs.verify-exit-code }}
        run: |
          set -euo pipefail
          # 先看自检结论：2 是「有人动过手脚」，3 是「流水线坏了」——
          # 两种都不该发出 Release，但退出码要留痕，别糊成一句「失败了」。
          if [ "${VERIFY_CODE}" != "0" ]; then
            echo "::error title=evidence-pack 自检未通过（退出码 ${VERIFY_CODE}）::拒绝发布一份自己都不信的包"
            exit "${VERIFY_CODE}"
          fi

          # 同一 tag 重跑不覆盖既有 Release 的正文与资产：正文里的锚点一旦被改写，
          # 之前所有下游核对都会对不上。
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::warning::Release ${GITHUB_REF_NAME} 已存在，跳过发布（提升版本号再发）"
            exit 0
          fi

          gh release create "${GITHUB_REF_NAME}" --generate-notes \
            "${BUNDLE}" ${SIGNATURE:+"${SIGNATURE}"}

          # 锚点写进 Release 正文：下游核对时从包外读，而不是从包里翻出来再回填。
          gh release view "${GITHUB_REF_NAME}" --json body -q .body > body.md
          {
            echo ""
            echo "---"
            echo ""
            echo "### 证据包锚点"
            echo ""
            echo "- sha256: \`${SHA256}\`"
            echo "- 签名: ${SIGN_MODE:-未签名（以 sha256 为锚点）}"
            echo ""
            echo "下游核对：把证据包与签名 bundle 取回来，用本仓库的校验步骤验一遍"
            echo "（把本仓库检出到 \`.evidence-pack\`，调 \`.evidence-pack/scripts/action-verify.sh\`，"
            echo "接法见 README「只校验、不打包」）。"
            echo ""
            echo "包外锚点：\`${SHA256}\` —— 核对时从登记它的地方取出来回送，不要从包里读。"
          } >> body.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file body.md
