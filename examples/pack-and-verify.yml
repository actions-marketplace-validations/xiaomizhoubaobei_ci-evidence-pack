# 最小可用：打包 → 登记锚点 → 自检 → 上传。
# 无签名也能构成证据，前提是 sha256 被登记到了包外（这里落到 artifact 与 job summary）。
name: evidence pack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # 签名身份唯一来源：没有它换不到 OIDC token

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建产物（示例）
        run: |
          mkdir -p dist configs
          echo 'build artifact' > dist/app.bin
          echo 'env: prod' > configs/app.yml

      - name: 生成证据包
        id: evidence
        uses: XMZZUZHI/Github/ci-evidence-pack@6d8ae66b768b8a77fb691fcb88729c8fc13dd912
        with:
          include: |
            dist/
            configs/
          sbom: auto
          sign: 'true'   # 身份来自 OIDC 短期证书，没有任何长期密钥
          # 无签名时的信任根：把 sha256 留在包外
          anchor-file: _evidence/anchor.txt
          expect-repo: ${{ github.repository }}
          # 身份由本次触发的 ref 决定：tag 上就是 @refs/tags/...
          # 写死 ref 会让「换个 ref 跑」变成一次事故，而它本不该是个事故。
          identity: https://github.com/${{ github.repository }}/.github/workflows/pack-and-verify.yml@${{ github.ref }}

      - name: 把锚点交给审计库（示例：打印到 summary）
        env:
          SHA256: ${{ steps.evidence.outputs.bundle-sha256 }}
          VERIFY_CODE: ${{ steps.evidence.outputs.verify-exit-code }}
        run: |
          echo "bundle sha256 = ${SHA256}"
          echo "verify exit   = ${VERIFY_CODE}"
          # 自检没过就别把摘要当锚点登记：一个 2 或 3 的包登记出去，
          # 等于给后来的人留了一份永远对不上的账。
          if [ "${VERIFY_CODE}" != "0" ]; then
            echo "::error title=证据包自检未通过（退出码 ${VERIFY_CODE}）::不登记这份包的摘要"
            exit 1
          fi
