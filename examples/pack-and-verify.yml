# 最小可用：打包（默认用 cosign 签名）→ 登记锚点 → 自检 → 上传。
#
# 签名是默认动作，所以这个 job 要 id-token: write。真的拿不到 OIDC token
# （自托管 runner）时，显式写 sign: 'false'，并靠包外的 sha256 锚点当信任根 ——
# 那时证据依然有意义，但前提是 sha256 真的被登记到了包外。
name: evidence pack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # keyless 签名（默认路径）必需

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建产物（示例）
        run: |
          mkdir -p dist configs
          echo 'build artifact' > dist/app.bin
          echo 'env: prod' > configs/app.yml

      - name: 生成证据包
        id: evidence
        uses: XMZZUZHI/Github/ci-evidence-pack@main
        with:
          include: |
            dist/
            configs/
          sbom: auto
          # 默认就签名（不写 sign 即 true），identity 要写死到具体 workflow 文件
          identity: https://github.com/${{ github.repository }}/.github/workflows/pack-and-verify.yml@refs/heads/main
          issuer: https://token.actions.githubusercontent.com
          # 包外台账：即使签了名，也把 sha256 登记一份，验包时能当锚点回送
          anchor-file: _evidence/anchor.txt
          expect-repo: ${{ github.repository }}

      - name: 把锚点交给审计库（示例：打印到 summary）
        run: |
          echo "bundle sha256 = ${{ steps.evidence.outputs.bundle-sha256 }}"
          echo "verify exit   = ${{ steps.evidence.outputs.verify-exit-code }}"
