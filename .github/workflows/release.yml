# 发版即取证：打 tag → 本仓库自测 → 用本仓库的 Action 生成并签名证据包 → 挂到 Release。
#
# 这份流水线还有一个身份要求：GitHub Marketplace 只在「由 Release 触发的 workflow」
# 发布时才会把 action.yml 上架。所以本文件既是指令也是目录（listing）开关 ——
# 删掉它，Action 就从 Marketplace 消失。
#
# 这里用的是 `uses: ./`：Marketplace 要求资格 workflow 引用本仓库的 Action，
# 所以本仓库给自己取证时只能走本地路径。外部调用方请钉 SHA（见 examples/）。
# 证据包的信任根仍然只有 OIDC 短期证书这一条路。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（workflow_dispatch 时必填，须已存在）'
        required: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发 Release 需要
      id-token: write   # 签名的信任根：没有它就拿不到短期证书
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全历史：SOURCE_DATE_EPOCH 才能稳定落到 commit 时间

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 发之前先证明这棵树自己是好的：测试红了就别发。
      - name: 自测
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q

      # 用本仓库的 Action 给这棵树打包并签名 —— 顺带把 Action 跑通一次。
      - name: 生成证据包并自检
        id: evidence
        uses: ./
        with:
          include: |
            src/
            scripts/
            examples/
            action.yml
            pyproject.toml
            README.md
            docs-usage.md
            AGENTS.md
            LICENSE
          sbom: auto
          anchor-file: _evidence/anchor.txt
          # 签名是默认动作，不给 sign 就是签：OIDC 换短期证书，没有别的分支。
          # identity 留空 = 按本次触发的 ref 自动生成（tag 上就是 @refs/tags/v0.0.1）。
          expect-repo: ${{ github.repository }}

      # 正文里的透明日志段落由这个脚本产出：把 JSON 折成 Markdown 的活放进 Python，
      # shell 只负责拼接 —— 在 `{ }` 里嵌 heredoc 能跑，但括号与缩进一错就极难看出。
      # 单独成步是因为它**必须**先于发布步骤存在：先写工具，再用工具。
      - name: 准备透明日志段落生成器
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat > rekor_section.py <<'PY'
          """把 rekor.json 折成 Release 正文里的一段 Markdown。

          三种情形必须说清是哪一种，不许含糊成一句「已存证」：
          未签名 / 无 tlog 条目 / 有条目。判断的是「证据强度」，不是「流程跑没跑完」。
          """
          import json
          import os

          entries = json.load(open("rekor.json", encoding="utf-8")).get("entries") or []
          signed = bool(os.environ.get("SIGNATURE"))

          if not signed:
              print("- 本次未签名，因而没有透明日志条目；信任根只有正文里的 sha256 锚点。")
          elif not entries:
              print("- 签名 bundle 内**没有**透明日志条目：这条签名缺少可复核的公开落点，")
              print("  不能单独构成证据。请检查 Rekor 连通性与签名时的 rekor 地址。")
          else:
              for entry in entries:
                  index = entry.get("log_index") or "未记录"
                  when = entry.get("integrated_time") or "未记录"
                  print(f"- logIndex `{index}`，integratedTime `{when}`")
                  if entry.get("log_id"):
                      print(f"  - logId `{entry['log_id']}`")
                  if entry.get("url"):
                      print(f"  - 查询地址 {entry['url']}")
          PY
          echo "透明日志段落生成器已就位"

      - name: 挂到 Release 并把锚点与透明日志写进正文
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.evidence.outputs.bundle-path }}
          SIGNATURE: ${{ steps.evidence.outputs.signature-bundle }}
          SHA256: ${{ steps.evidence.outputs.bundle-sha256 }}
          SIGN_MODE: ${{ steps.evidence.outputs.signature-mode }}
          VERIFY_CODE: ${{ steps.evidence.outputs.verify-exit-code }}
        run: |
          set -euo pipefail
          # 先看自检结论：2 是「有人动过手脚」，3 是「流水线坏了」——
          # 两种都不该发出 Release，但退出码要留痕。
          if [ "${VERIFY_CODE:-3}" != "0" ]; then
            echo "::error title=evidence-pack 自检未通过（退出码 ${VERIFY_CODE:-空}）::拒绝发布一份自己都不信的包"
            exit 1
          fi

          # 同一 tag 重跑不覆盖既有 Release 的正文：正文里的锚点一旦被改写，
          # 之前所有下游核对都会对不上。
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::warning::Release ${GITHUB_REF_NAME} 已存在，跳过发布（提升版本号再发）"
            exit 0
          fi

          gh release create "${GITHUB_REF_NAME}" --generate-notes \
            "${BUNDLE}" ${SIGNATURE:+"${SIGNATURE}"}

          # 透明日志条目从签名 bundle 里读，不从日志文本里抠：logIndex / logId
          # 只有 bundle 那一处是权威的。交给本仓库内核解析，免得在 YAML 里
          # 手搓 jq —— 字段一改名，表达式会静默变成空值，正文照样发得出去。
          #
          # 解析失败不拦发布：它只意味着「这条签名没有可复核的公开落点」。
          # 正文里如实写明，比让整条 Release 消失更接近事实。
          entries=0
          if [ -n "${SIGNATURE}" ] && [ -f "${SIGNATURE}" ]; then
            if PYTHONPATH="${GITHUB_WORKSPACE}/src" INPUT_SIGNATURE_BUNDLE="${SIGNATURE}" \
                 python3 -m evidence_pack.action rekor > rekor.json; then
              entries="$(python3 -c 'import json;print(json.load(open("rekor.json"))["count"])')"
            else
              echo "::warning::解析透明日志条目失败，正文将标注「未取到」"
              echo '{"entries":[]}' > rekor.json
            fi
          else
            # 未签名就没有 Rekor 条目可言 —— 这是设计内的情形，不该装成解析失败。
            echo '{"entries":[]}' > rekor.json
          fi

          gh release view "${GITHUB_REF_NAME}" --json body -q .body > body.md
          {
            echo ""
            echo "---"
            echo ""
            echo "### 证据包锚点"
            echo ""
            echo "- sha256: \`${SHA256}\`"
            echo "- 签名: ${SIGN_MODE:-未签名（以 sha256 为锚点）}"
            echo ""
            echo "下游核对：把证据包与签名 bundle 取回来，用本仓库的校验步骤验一遍"
            echo "（把本仓库检出到 \`.evidence-pack\`，调 \`.evidence-pack/scripts/action-verify.sh\`，"
            echo "接法见 README「只校验、不打包」）。"
            echo ""
            echo "包外锚点：\`${SHA256}\` —— 核对时从登记它的地方取出来回送，不要从包里读。"
            echo ""
            echo "### 透明日志（Rekor）"
            echo ""
            echo "签名写入公开透明日志后，任何人都能在包外独立复核「这条签名在某个时刻确实存在过」。"
            echo "这是 sha256 锚点之外的第二个落点：锚点记在哪里由你决定，日志记在哪里由密码学决定。"
            echo ""
            python3 rekor_section.py
            echo ""
            if [ "${entries}" != "0" ]; then
              echo '```bash'
              echo "# 逐条复核：序号就是上面的 logIndex"
              echo "rekor-cli get --rekor_server https://rekor.sigstore.dev --log-index <logIndex>"
              echo '```'
            fi
          } >> body.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file body.md
