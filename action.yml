name: 'evidence-pack'
description: '把一次 CI 构建钉成可独立验证的证据包：确定性打包 + 严格 manifest + cosign bundle 签名 + 退出码 0/2/3 分层'
author: 'XMZZUZHI'

branding:
  icon: 'package'
  color: 'purple'

inputs:
  include:
    description: |
      要收进包的文件/目录，相对仓库根，一行一个（支持 # 注释）。
      例如：dist/ / configs/ / sbom.json
    required: true

  exclude:
    description: '额外排除的目录名，一行一个。默认已排除 .git / node_modules / dist / .venv 等'
    required: false
    default: ''

  sbom:
    description: 'auto | none | python | node。auto 认不出项目类型时自动跳过'
    required: false
    default: 'auto'

  out-dir:
    description: '证据包输出目录（会被自动排除在收集范围外）'
    required: false
    default: '_evidence'

  bundle-name:
    description: '证据包文件名，默认 evidence-<短 sha>.tar.gz'
    required: false
    default: ''

  sign:
    description: |
      是否用 cosign 签名，默认 'true'（签名是默认动作，关掉要明说）。
      给了 cosign-key 走 key 模式，否则走 keyless —— keyless 的信任根是 OIDC，
      所以 job 必须声明 permissions.id-token: write（job 级 permissions 会覆盖
      顶层声明，要写在 job 上）。该权限只在 GitHub 托管 runner 上有；
      自托管 / 本地没有 OIDC 签发方，请改用 cosign-key，或显式 'false' 并
      以包外 sha256 锚点当信任根。关掉签名只在你有另一条包外锚点时才是可辩护的。

      判定只认字面量 'false'：留空 / 其它值都按默认签名处理。
      条件传值时写 `cond && 'false' || ''`，别直接传 outputs ——
      布尔值渲染出来是 'False'（大写 F），不是 'false'，判定会失效。
    required: false
    default: 'true'

  cosign-key:
    description: |
      cosign **私钥**路径，仅用于签名（key 模式）。口令请通过 COSIGN_PASSWORD
      环境变量注入，不要写在这个输入里 —— 输入会被流水线日志记住
    required: false
    default: ''

  cosign-public-key:
    description: |
      cosign **公钥**路径，仅用于验签。签名用私钥、验签用公钥，两者不能互换：
      填错时 cosign 会直接拒绝，不会「凑合着验」
    required: false
    default: ''

  identity:
    description: |
      keyless 期望签发身份，例如
      https://github.com/<owner>/<repo>/.github/workflows/<file>.yml@refs/heads/main
      会被写进包内 metadata/binding.json，并作为验签时的默认期望值。

      留空时自动拼：repository + workflow_ref + ref_name
      （在 tag 上跑就是 .../<file>.yml@refs/tags/v1.0.0）。
      写死 @refs/heads/main 的写法在 tag 上必然验不过，那不是配置笔误，
      是「签名身份不是我以为的那个」，判定为 2。
    required: false
    default: ''

  issuer:
    description: 'keyless 期望 OIDC issuer，默认 https://token.actions.githubusercontent.com'
    required: false
    default: 'https://token.actions.githubusercontent.com'

  verify:
    description: |
      打完包后立刻自检。true 时：有签名则验签名，无签名则要求同时提供 expect-sha256，
      否则会如实判成「不构成证据」（退出码 2）
    required: false
    default: 'true'

  expect-sha256:
    description: |
      包外锚点：期望的 bundle sha256。留空则用本步骤刚打出的包自身摘要 ——
      那是「自己给自己发证」，只够证明产物没在步骤之间被动过；
      真正的包外锚点请从你登记它的地方（制品库 / 审计库）回送
    required: false
    default: ''

  expect-repo:
    description: '包外锚点：期望的 owner/repo'
    required: false
    default: ''

  anchor-file:
    description: |
      把 bundle 的 sha256 追加登记到这个文件（包外台账）。
      留空则不登记。它只是「方便你接着上传到审计库」，不是信任根本身
    required: false
    default: ''

  upload-artifact:
    description: '是否把证据包、签名 bundle、锚点台账作为 Actions artifact 上传'
    required: false
    default: 'true'

  artifact-name:
    description: '上传 artifact 的名字，留空时用包的 sha256 前 16 位（跨 job 唯一、不含非法字符）'
    required: false
    default: ''

  retention-days:
    description: 'artifact 保留天数'
    required: false
    default: '30'

  fail-on-invalid:
    description: |
      verify 判定为证据无效（2）或工具异常（3）时，是否让这个步骤失败。
      设为 false 时只在 outputs / summary 里留结论，适合「先取证、后发版」的流程
    required: false
    default: 'true'

outputs:
  bundle-path:
    description: '证据包的绝对路径'
    value: ${{ steps.pack.outputs.bundle-path }}
  bundle-name:
    description: '证据包文件名'
    value: ${{ steps.pack.outputs.bundle-name }}
  bundle-sha256:
    description: '证据包的 sha256（包外锚点就是它）'
    value: ${{ steps.pack.outputs.bundle-sha256 }}
  signature-bundle:
    description: 'cosign .sigstore.json 路径，未签名时为空'
    value: ${{ steps.pack.outputs.signature-bundle }}
  signed:
    description: "'true' 表示已产出签名 bundle"
    value: ${{ steps.pack.outputs.signed }}
  signature-mode:
    description: 'key / keyless；未签名时为空'
    value: ${{ steps.pack.outputs.signature-mode }}
  file-count:
    description: '包内文件数（不含 manifest 自身）'
    value: ${{ steps.pack.outputs.file-count }}
  source-date-epoch:
    description: '打包用的确定性时间戳（证据包「何时产生」的唯一答案）'
    value: ${{ steps.pack.outputs.source-date-epoch }}
  artifact-name:
    description: '实际上传的 artifact 名（未上传时为空）'
    value: ${{ steps.pack.outputs.artifact-name }}
  anchor-file:
    description: '锚点台账的绝对路径（未登记时为空）'
    value: ${{ steps.anchor.outputs.anchor-file }}
  verify-ok:
    description: '自检结论（未开启 verify 时为空）'
    value: ${{ steps.verify.outputs.ok }}
  verify-exit-code:
    description: '自检退出码：0 通过 / 1 用法 / 2 证据无效 / 3 工具异常'
    value: ${{ steps.verify.outputs.exit-code }}
  verify-error:
    description: '自检失败原因（通过时为空）'
    value: ${{ steps.verify.outputs.error }}
  signature-verified:
    description: "'true' 表示签名真的验过（不只是「有签名」）"
    value: ${{ steps.verify.outputs.signature-verified }}
  anchored:
    description: "'true' 表示包外锚点核对过"
    value: ${{ steps.verify.outputs.anchored }}

runs:
  using: 'composite'
  steps:
    - name: 检查 Python 运行时
      shell: bash
      run: |
        set -euo pipefail
        command -v python3 >/dev/null 2>&1 || {
          echo "::error::找不到 python3。ubuntu/macos 的 runner 自带；自托管 runner 请先装 Python 3.10+"
          exit 1
        }
        python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)' || {
          echo "::error::evidence-pack 需要 Python 3.10+，当前是 $(python3 -V 2>&1)"
          exit 1
        }

    # 只在真要签名时装。判据与 scripts/action-pack.sh 保持一致：
    # 小写 'true' 才算开，空串 / 'false' / 'False' 一律不算 —— 一个渲染出来的
    # 布尔值不该把一次打包变成「找不到 cosign」。
    - name: 安装 cosign
      if: inputs.sign == 'true'
      uses: sigstore/cosign-installer@v3

    # 为什么要在 Action 里替用户装扫描器：`sbom: auto` 认出一个 Python 项目后，
    # 若机器上既没有 cyclonedx-py 又只有 pyproject.toml（现代 Python 项目的
    # 常态），内核会如实报退出码 3 —— 语义没错，但对「开箱即用」是硬伤。
    # 所以在这里按项目类型把扫描器补齐；装不上仍然由内核判 3，不吞结论。
    - name: 准备 SBOM 扫描器
      if: inputs.sbom != 'none'
      shell: bash
      env:
        REPO_ROOT: ${{ github.workspace }}
        INPUT_SBOM: ${{ inputs.sbom }}
      run: |
        set -uo pipefail
        want="${INPUT_SBOM:-auto}"
        # auto 时按仓库里的文件判断该装哪一套，与内核的 detect_kind 保持一致。
        if [ "$want" = "auto" ]; then
          if [ -f "$REPO_ROOT/pyproject.toml" ] || [ -f "$REPO_ROOT/setup.py" ] \
             || [ -f "$REPO_ROOT/requirements.txt" ] || [ -f "$REPO_ROOT/poetry.lock" ]; then
            want=python
          elif [ -f "$REPO_ROOT/package.json" ]; then
            want=node
          else
            echo "::notice::认不出项目类型，跳过 SBOM 扫描器安装（内核会判 sbom=none）"
            exit 0
          fi
        fi
        install_failed() {
          # 装不上不算这一步的失败：按设计，扫描器缺失该由内核判 3。
          # 在这里提前红掉，会把「工具没装好」和「证据无效」混成同一种颜色。
          echo "::warning::$1 安装失败，若内核因此判定 3，请检查网络或自行预装"
          exit 0
        }
        if [ "$want" = "python" ]; then
          # 3.10 没有标准库 tomllib：从 pyproject.toml 兜底 SBOM 要用到 tomli。
          # 3.11+ 自带，不必装。两个都试一把，装不上就让内核按 3 报出来。
          if ! python3 -c 'import tomllib' >/dev/null 2>&1 \
             && ! python3 -c 'import tomli' >/dev/null 2>&1; then
            python3 -m pip install --quiet 'tomli>=2,<3' \
              || echo "::warning::tomli 没装上：Python 3.10 从 pyproject.toml 兜底 SBOM 会失败"
          fi
          command -v cyclonedx-py >/dev/null 2>&1 && exit 0
          python3 -m pip install --quiet cyclonedx-bom \
            || install_failed "cyclonedx-bom"
        elif [ "$want" = "node" ]; then
          command -v cyclonedx-npm >/dev/null 2>&1 && exit 0
          npm install --global --silent @cyclonedx/cyclonedx-npm \
            || install_failed "@cyclonedx/cyclonedx-npm"
        fi

    - name: 打出证据包
      id: pack
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPO_ROOT: ${{ github.workspace }}
        INPUT_INCLUDE: ${{ inputs.include }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_SBOM: ${{ inputs.sbom }}
        INPUT_OUT_DIR: ${{ inputs.out-dir }}
        INPUT_BUNDLE_NAME: ${{ inputs.bundle-name }}
        INPUT_SIGN: ${{ inputs.sign }}
        INPUT_COSIGN_KEY: ${{ inputs.cosign-key }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        # identity 留空时按 realm/workflow_ref 现拼：identity 里的 @refs/...
        # 必须跟着本次触发的 ref 走，写死 main 的示例在 tag 上必然判 2。
        INPUT_IDENTITY: ${{ inputs.identity || format('https://github.com/{0}/{1}@{2}', github.repository, github.workflow_ref, github.ref_name) }}
        INPUT_ISSUER: ${{ inputs.issuer }}
      run: bash "${{ github.action_path }}/scripts/action-pack.sh"

    - name: 登记包外锚点
      id: anchor
      if: inputs.anchor-file != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_BUNDLE: ${{ steps.pack.outputs.bundle-path }}
        INPUT_ANCHOR_FILE: ${{ inputs.anchor-file }}
      run: bash "${{ github.action_path }}/scripts/action-anchor.sh"

    - name: 校验证据包
      id: verify
      if: inputs.verify == 'true'
      continue-on-error: true
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_BUNDLE: ${{ steps.pack.outputs.bundle-path }}
        # 未签名时这个值为空字符串，脚本据此跳过签名校验（而不是拿空路径去调 cosign）。
        INPUT_SIGNATURE_BUNDLE: ${{ steps.pack.outputs.signature-bundle }}
        INPUT_COSIGN_PUBLIC_KEY: ${{ inputs.cosign-public-key }}
        # 与打包步骤同源：验签要用的期望身份就是打包时写进 binding.json 的那个。
        INPUT_IDENTITY: ${{ inputs.identity || format('https://github.com/{0}/{1}@{2}', github.repository, github.workflow_ref, github.ref_name) }}
        INPUT_ISSUER: ${{ inputs.issuer }}
        INPUT_EXPECT_SHA256: ${{ inputs.expect-sha256 || steps.pack.outputs.bundle-sha256 }}
        INPUT_EXPECT_REPO: ${{ inputs.expect-repo || github.repository }}
      run: |
        set +e
        bash "${{ github.action_path }}/scripts/action-verify.sh"
        code=$?
        set -e
        if [ "$code" -eq 0 ]; then
          exit 0
        fi
        if [ "${{ inputs.fail-on-invalid }}" != "true" ]; then
          echo "::warning::evidence-pack 判定未通过（退出码 $code），按 fail-on-invalid=false 继续"
          exit 0
        fi
        # 步骤本身标了 continue-on-error，所以这里必须自己把结论落成失败状态：
        # 否则 fail-on-invalid=true 只是句口号，流水线照样绿。
        echo "::error::evidence-pack 自检失败（退出码 $code）：详情见上一步的 summary"
        exit "$code"

    - name: 上传证据包
      if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        # 用脚本算好的 artifact-name：已经做过字符规范化与长度截断，
        # 直接拿 bundle-name 会踩 artifact 名的 `" : < > | * ? \ /` 禁用字符。
        name: ${{ steps.pack.outputs.artifact-name }}
        # 逐行给真实文件：未签名 / 未登记锚点时对应那行是空串，
        # 所以这里配 if-no-files-found: warn 而不是 error —— 缺件只提醒不拦流程。
        path: |
          ${{ steps.pack.outputs.bundle-path }}
          ${{ steps.pack.outputs.signature-bundle }}
          ${{ steps.anchor.outputs.anchor-file }}
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}
