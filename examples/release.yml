# 发版即取证：打 tag / 手动触发 → 打包产物 → 签名 → 自检 → 挂到 Release。
#
# 这是「照抄就能跑」的那一份：除了把你自己的产物路径填进 include，
# 不需要改任何其他东西。没配 cosign 密钥也不会红 —— 那时走 keyless。
#
# 先说清一件事：没签名时，自检回送的是刚打出来的包摘要，那只够证明
# 「步骤之间没被动过」，属于自己给自己发证。真正的包外锚点由最后一步
# 把 sha256 写进 Release 正文 + 上传 artifact 完成 —— 下游核对时从
# 那里读，而不是从包里翻出来再回填。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# id-token: write 是 keyless 签名（默认路径）的硬前提：它签发 OIDC token，
# 少了它 Action 会直接判退出码 3，而不是悄悄不签。job 级写 permissions 时
# 注意这里会覆盖顶层 —— 本文件只写顶层一处，job 里不再重写。
permissions:
  contents: write   # 挂 Release 需要
  id-token: write   # keyless 签名必需

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取全历史，SOURCE_DATE_EPOCH 才能稳定落到 commit 时间

      # ↓↓↓ 换成你自己的构建步骤 ↓↓↓
      - name: 构建
        run: |
          mkdir -p dist
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist
      # ↑↑↑ 上面这两行是唯一需要你改的地方 ↑↑↑

      # 签名是默认动作，默认路径是 keyless：信任根是 job 的 OIDC token，
      # 不需要任何长期密钥。想持钥签名（自托管 runner / 想完全离线验签）时，
      # 把 COSIGN_KEY_B64 / COSIGN_PUBLIC_KEY_B64 两个 secret 配上即可，
      # 下面的步骤会自动切到 key 模式。
      #
      # 两种情形都走不到时（既没密钥、也没有 OIDC）才会显式关签名，
      # 退化成「无签名 + 包外 sha256 锚点」—— 那仍算证据，前提是锚点真的在包外。
      - name: 准备 cosign 密钥（配了才用，否则走默认 keyless）
        id: cosign
        env:
          COSIGN_KEY_B64: ${{ secrets.COSIGN_KEY_B64 }}
          COSIGN_PUBLIC_KEY_B64: ${{ secrets.COSIGN_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail
          # 用 base64 存 secret：PEM 里的换行经过 YAML/JSON 很容易被吃掉，
          # 而一个「少了换行的私钥」只会报一句难以理解的解析错误。
          if [ -z "${COSIGN_KEY_B64:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 COSIGN_KEY_B64 —— 走默认的 keyless 签名（需要 id-token: write）"
            exit 0
          fi
          if [ -z "${COSIGN_PUBLIC_KEY_B64:-}" ]; then
            # 签名用私钥、验签用公钥：只给私钥等于能签不能验，
            # 那这份包的签名在自检那步就会被判 2。
            echo "::error::配了 COSIGN_KEY_B64 就必须同时配 COSIGN_PUBLIC_KEY_B64，否则签得出、验不了"
            exit 1
          fi
          umask 077
          mkdir -p _keys
          printf '%s' "$COSIGN_KEY_B64" | base64 -d > _keys/cosign.key
          printf '%s' "$COSIGN_PUBLIC_KEY_B64" | base64 -d > _keys/cosign.pub
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: 生成证据包
        id: evidence
        uses: XMZZUZHI/Github/ci-evidence-pack@main
        with:
          include: |
            dist/
            pyproject.toml
          sbom: auto
          anchor-file: _evidence/anchor.txt
          # 留空 = 保持默认（签名）。注意这里的空串是「没给」，不是布尔 false：
          # 表达式的 false 渲染成字符串 "False"，Action 只认 "false"，会当场判 3。
          sign: ${{ steps.cosign.outputs.configured == 'true' && 'true' || '' }}
          cosign-key: ${{ steps.cosign.outputs.configured == 'true' && '_keys/cosign.key' || '' }}
          cosign-public-key: ${{ steps.cosign.outputs.configured == 'true' && '_keys/cosign.pub' || '' }}
          # keyless 时 identity 必须写死到具体 workflow 文件：宽匹配等于谁都能签
          identity: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          issuer: https://token.actions.githubusercontent.com
          # 包内若记了 remote 就核对，没记则只留告警不判红
          expect-repo: ${{ github.repository }}
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: 把证据包挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ steps.evidence.outputs.bundle-path }}" \
            "${{ steps.evidence.outputs.signature-bundle }}" \
            --clobber
          # 自检若判了 2/3，Action 那步已经红过；这里再挡一道，免得「红着也发出去了」。
          if [ "${{ steps.evidence.outputs.verify-exit-code }}" != "0" ]; then
            echo "::error title=evidence-pack 自检未通过::拒绝为一份自己都不信的包发版"
            exit 1
          fi
          # 锚点也贴进 Release 正文：将来核对时从包外读，而不是从包里翻。
          gh release view "${GITHUB_REF_NAME}" --json body -q .body > body.md
          {
            echo ""
            echo "### 证据包锚点"
            echo ""
            echo "- sha256: \`${{ steps.evidence.outputs.bundle-sha256 }}\`"
            echo "- 签名: ${{ steps.evidence.outputs.signature-mode || '未签名（以 sha256 为锚点）' }}"
          } >> body.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file body.md

      - name: 清掉临时密钥
        if: always()
        run: rm -rf _keys
