# 发版即取证：打 tag / 手动触发 → 打包产物 → 签名 → 自检 → 挂到 Release。
#
# 这是「照抄就能跑」的那一份：除了把你自己的产物路径填进 include，
# 不需要改任何其他东西，也不需要配任何签名密钥 ——
# 签名的身份来自本次构建的 OIDC token，锁的是一张 10 分钟就过期的短期证书。
#
# 先说清一件事：没签名时，自检回送的是刚打出来的包摘要，那只够证明
# 「步骤之间没被动过」，属于自己给自己发证。真正的包外锚点由最后一步
# 把 sha256 写进 Release 正文 + 上传 artifact 完成 —— 下游核对时从
# 那里读，而不是从包里翻出来再回填。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 挂 Release 需要
  id-token: write   # 签名的信任根：没有它就没有短期证书，也就没有签名

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取全历史，SOURCE_DATE_EPOCH 才能稳定落到 commit 时间

      # ↓↓↓ 换成你自己的构建步骤 ↓↓↓
      - name: 构建
        run: |
          mkdir -p dist
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist
      # ↑↑↑ 上面这两行是唯一需要你改的地方 ↑↑↑

      - name: 生成证据包
        id: evidence
        # 钉到 SHA，别用 @main：浮动引用会让「到底跑的是哪一版」永远说不清，
        # 修没修好也就无从判定。升级时换 SHA，换完再看一次自检结论。
        uses: XMZZUZHI/Github/ci-evidence-pack@6d8ae66b768b8a77fb691fcb88729c8fc13dd912
        with:
          include: |
            dist/
            pyproject.toml
          sbom: auto
          # 无签名时的信任根：把 sha256 登记到包外的台账（会作为 artifact 上传）
          anchor-file: _evidence/anchor.txt
          # 签名是默认动作，不给 sign 就是签：OIDC 换短期证书，没有别的分支。
          # 小写 'false' 才是关；空串 = 没给 = 沿用默认（默认就是签名）。
          # identity 留空 = 按本次触发的 ref 自动生成。
          # 写死 @refs/heads/main 的写法在 tag 上必然判 2，那不是配置笔误，
          # 是「签名身份不是我以为的那个」。
          # 显式给出期望仓库：包内若记了 remote 就核对，没记则只留告警不判红
          expect-repo: ${{ github.repository }}

      - name: 把证据包挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_CODE: ${{ steps.evidence.outputs.verify-exit-code }}
        run: |
          set -euo pipefail
          # 发出一份自己都不信的包，比不发更糟：下游会以为它验过了。
          # 2 是「有人动过手脚」，3 是「流水线坏了」—— 都不许发，但退出码要留痕。
          if [ "${VERIFY_CODE:-3}" != "0" ]; then
            echo "::error title=evidence-pack 自检未通过（退出码 ${VERIFY_CODE:-空}）::拒绝发布一份自己都不信的包"
            exit 1
          fi
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ steps.evidence.outputs.bundle-path }}" \
            "${{ steps.evidence.outputs.signature-bundle }}" \
            --clobber
          # 锚点也贴进 Release 正文：将来核对时从包外读，而不是从包里翻。
          gh release view "${GITHUB_REF_NAME}" --json body -q .body > body.md
          cat >> body.md <<'MD'

          ### 证据包锚点

          - sha256: `${{ steps.evidence.outputs.bundle-sha256 }}`
          - 签名: ${{ steps.evidence.outputs.signature-mode || '未签名（以 sha256 为锚点）' }}

          ### 透明日志（Rekor）

          签名写入公开透明日志后，任何人都能在包外独立复核「这条签名在某个时刻确实存在过」。
          这是 sha256 锚点之外的第二个落点：锚点记在哪里由你决定，日志记在哪里由密码学决定。

          MD
          # 条目从签名 bundle 里读，不从日志文本里抠 —— logIndex / logId 只有那一处是权威的。
          # 读不出来不拦发布：它只意味着「这条签名没有可复核的公开落点」，正文里如实写。
          sig="${{ steps.evidence.outputs.signature-bundle }}"
          if [ -n "$sig" ] && evidence-pack rekor "$sig" --json > rekor.json; then
            python3 - <<'PY' >> body.md
          import json

          entries = json.load(open("rekor.json", encoding="utf-8"))["entries"]
          if not entries:
              print("- 签名 bundle 内**没有**透明日志条目：这条签名缺少可复核的公开落点，")
              print("  不能单独构成证据。请检查 Rekor 连通性与 `--rekor-url`。")
          for e in entries:
              print(f"- logIndex `{e['log_index']}`，integratedTime `{e['integrated_time']}`")
              if e["log_id"]:
                  print(f"  - logId `{e['log_id']}`")
              if e["url"]:
                  print(f"  - 查询地址 {e['url']}")
          PY
            rm -f rekor.json
          else
            echo "- 本次未签名或条目解析失败，因而没有透明日志条目；信任根只有上方 sha256 锚点。" >> body.md
          fi
          gh release edit "${GITHUB_REF_NAME}" --notes-file body.md

      - name: 清掉临时密钥
        if: always()
        run: rm -rf _keys
