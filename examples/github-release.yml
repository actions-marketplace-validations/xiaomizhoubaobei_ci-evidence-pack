# 发版即取证（GitHub 版）：打 tag → 构建 → 生成并签名证据包 → 自检 → 挂到 Release。
#
# 照抄到 .github/workflows/ 就能跑。需要你改的只有两处：
#   1. 「构建」步骤里的产物路径（并同步改 include 里对应那一行）
#   2. 三个 secret（可选）：COSIGN_KEY_B64 / COSIGN_PUBLIC_KEY_B64 / COSIGN_PASSWORD
#
# 没配密钥也照样绿：退化成「无签名 + sha256 锚点」。但请记住——
# sha256 被写进 Release 正文，才让这份包成为证据；包里那份 manifest 只证明自洽。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 顶层只给只读：写能力（发 Release）下沉到 job，避免任一步骤被替换就拿到发布权。
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发 Release 需要
      # keyless 签名（默认路径）必需。job 级 permissions 会整体覆盖顶层声明，
      # 所以顶层写了 id-token 也不算，得在这里再写一遍。
      # 用 key 模式时它用不上，留着无害。
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全历史：SOURCE_DATE_EPOCH 才能稳定落到 commit 时间

      # ↓↓↓ 换成你自己的构建步骤 ↓↓↓
      - name: 构建
        run: |
          mkdir -p dist
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist
      # ↑↑↑ 上面是唯一需要你改的地方 ↑↑↑

      # cosign 的密钥是**文件**不是字符串。用 base64 存：PEM 的换行过一遍 YAML
      # 容易被吃掉，而「少了换行的私钥」只会回你一句看不懂的解析错误。
      - name: 准备 cosign 密钥（没配则跳过）
        id: cosign
        env:
          COSIGN_KEY_B64: ${{ secrets.COSIGN_KEY_B64 }}
          COSIGN_PUBLIC_KEY_B64: ${{ secrets.COSIGN_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${COSIGN_KEY_B64:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 COSIGN_KEY_B64，本次不签名 —— 以 sha256 锚点为准"
            exit 0
          fi
          umask 077
          mkdir -p _keys
          printf '%s' "$COSIGN_KEY_B64"        | base64 -d > _keys/cosign.key
          printf '%s' "$COSIGN_PUBLIC_KEY_B64" | base64 -d > _keys/cosign.pub
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: 生成证据包并自检
        id: evidence
        uses: XMZZUZHI/Github/ci-evidence-pack@main
        with:
          include: |
            dist/
            pyproject.toml
          sbom: auto
          # 包外台账：sha256 落到 _evidence/anchor.txt，随 artifact 一起上传
          anchor-file: _evidence/anchor.txt
          # 配了密钥就签。注意签名用私钥、验签用公钥，拿私钥去验是安全上的错
          sign: ${{ steps.cosign.outputs.configured || 'false' }}
          cosign-key: ${{ steps.cosign.outputs.configured == 'true' && '_keys/cosign.key' || '' }}
          cosign-public-key: ${{ steps.cosign.outputs.configured == 'true' && '_keys/cosign.pub' || '' }}
          # 包内记了 remote 就核对；没记（actions/checkout 默认没有）只留告警不判红
          expect-repo: ${{ github.repository }}
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      # 白名单校验：发布包里只允许出现你打算交付的东西。
      # 开发资产（.git/ tests/ AGENTS.md install_gpg_keys.sh 等）一旦混进去，
      # 会被铺到使用者的目录里，其中改写全局 git 配置的脚本若被误执行，风险由使用者承担。
      # 白名单校验：证据包里只允许出现你打算交付的东西。
      # 开发资产（.git/ tests/ AGENTS.md install_gpg_keys.sh 等）一旦混进去，
      # 可能被铺到使用者的目录里，其中改写全局 git 配置的脚本若被误执行，
      # 风险由使用者承担。
      #
      # 清单用 python 的 tarfile 读，而不是 `tar -tzf | awk`：后者遇到带空格的
      # 文件名会截断，白名单校验就变成漏判。
      - name: 校验证据包边界
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BUNDLE: ${{ steps.evidence.outputs.bundle-path }}
          ALLOW: '^(dist/|pyproject\.toml$)'
          REQUIRED: 'dist/'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys, tarfile

          bundle = os.environ["BUNDLE"]
          allow = re.compile(os.environ["ALLOW"])
          required = os.environ["REQUIRED"].split()

          with tarfile.open(bundle, "r:gz") as tar:
              # 包内布局见 docs：artifacts/<仓库相对路径>
              entries = [n[len("artifacts/"):] for n in tar.getnames()
                         if n.startswith("artifacts/")]

          bad = sorted(e for e in entries if e and not allow.match(e))
          if bad:
              sys.exit(f"::error::证据包里混入了白名单之外的条目: {', '.join(bad[:5])}")
          missing = [r for r in required if not any(e.startswith(r) for e in entries)]
          if missing:
              sys.exit(f"::error::证据包缺少必需路径: {', '.join(missing)}")
          print(f"证据包边界校验通过（{len(entries)} 个条目）")
          PY

      - name: 挂到 Release 并把锚点写进正文
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.evidence.outputs.bundle-path }}
          SIGNATURE: ${{ steps.evidence.outputs.signature-bundle }}
          SHA256: ${{ steps.evidence.outputs.bundle-sha256 }}
          SIGN_MODE: ${{ steps.evidence.outputs.signature-mode }}
          VERIFY_CODE: ${{ steps.evidence.outputs.verify-exit-code }}
        run: |
          set -euo pipefail
          # 先看自检结论：2 是「有人动过手脚」，3 是「流水线坏了」——
          # 两种都不该发出 Release，但退出码要留痕，别糊成一句「失败了」。
          if [ "${VERIFY_CODE}" != "0" ]; then
            echo "::error title=evidence-pack 自检未通过（退出码 ${VERIFY_CODE}）::拒绝发布一份自己都不信的包"
            exit "${VERIFY_CODE}"
          fi

          # 同一 tag 重跑不覆盖既有 Release 的正文与资产：正文里的锚点一旦被改写，
          # 之前所有下游核对都会对不上。
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::warning::Release ${GITHUB_REF_NAME} 已存在，跳过发布（提升版本号再发）"
            exit 0
          fi

          gh release create "${GITHUB_REF_NAME}" --generate-notes \
            "${BUNDLE}" ${SIGNATURE:+"${SIGNATURE}"}

          # 锚点写进 Release 正文：下游核对时从包外读，而不是从包里翻出来再回填。
          gh release view "${GITHUB_REF_NAME}" --json body -q .body > body.md
          {
            echo ""
            echo "---"
            echo ""
            echo "### 证据包锚点"
            echo ""
            echo "- sha256: \`${SHA256}\`"
            echo "- 签名: ${SIGN_MODE:-未签名（以 sha256 为锚点）}"
            echo ""
            echo '```bash'
            echo "evidence-pack verify evidence-*.tar.gz --expect-sha256 ${SHA256}"
            echo '```'
          } >> body.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file body.md

      - name: 清掉临时密钥
        if: always()
        run: rm -rf _keys
